<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Polplab" />
    <meta name="copyright" content="© Polplab. All rights reserved." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f4" />
    <title>Polplab — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before first paint so there is no flash
      try {
        document.documentElement.dataset.theme = localStorage.getItem('polplab-theme') || 'light'
        document.documentElement.dataset.accent = localStorage.getItem('polplab-accent') || 'orange'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
